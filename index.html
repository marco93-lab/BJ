<style>
:root{--ink:#16231B;--green:#1E4631;--green2:#2F6446;--paper:#F3F0E8;--stone:#E7E0D2;--line:#DDD6C6;--text2:#3D4A41;--orange:#B8561E;--orange2:#E0914F;--mint:#E4ECE5}
*{box-sizing:border-box}
html{scroll-behavior:smooth}

h1,h2,h3{margin:0}

/* header */
header{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}

nav{display:flex;gap:32px;font-size:15px;font-weight:600}
nav a:hover{color:var(--orange)}
.hcta{display:flex;gap:10px}
.hcta .btn{padding:12px 20px;font-size:15px}

/* hero */
.hero .wrap{padding-top:64px;padding-bottom:80px;display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center}
.hero h1{font-family:'Bricolage Grotesque',sans-serif;font-size:80px;line-height:.95;font-weight:800;letter-spacing:-3px;margin:24px 0}
.hero p.lead{font-size:20px;line-height:1.55;color:var(--text2);max-width:560px}

.hero-img{position:relative;height:620px}

.hero-img .b{position:absolute;left:0;bottom:0;width:48%;height:260px;border-radius:24px;border:8px solid var(--paper);background:#CFC5B2 center/cover no-repeat;background-image:url(images/maconnerie-accueil.jpg)}
.hero-img .tag{position:absolute;right:24px;bottom:120px;background:var(--paper);border-radius:16px;padding:14px 18px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center}

/* band */
.band{background:var(--ink);color:var(--paper);overflow:hidden}

.band i{color:var(--orange2);font-style:normal}

/* services */
.svc{padding:110px 0}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.card{background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}

.card.dark{background:var(--green);color:var(--paper)}
.card.dark p{color:#D5DED7}
.badge{font-size:11px;font-weight:800;letter-spacing:1px;padding:5px 10px;border-radius:999px;background:var(--orange2);color:var(--ink);font-family:'Manrope',sans-serif}
.note{margin-top:28px;display:flex;gap:14px;align-items:center;padding:22px 28px;border:1.5px dashed #B9B09C;border-radius:18px;font-size:16px;color:var(--text2)}
.note strong{color:var(--ink)}

/* formules */

.plan{padding:40px;border:1px solid #3A4A3F;border-radius:24px;display:flex;flex-direction:column;gap:22px}

.plan h3{font-family:'Bricolage Grotesque',sans-serif;font-size:33px;font-weight:700}
.plan p{font-size:16px;line-height:1.6;color:#B7C2BA}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;font-size:15px}
.plan li:before{content:"— "}
.plan .btn{margin-top:auto;justify-content:center;border:1.5px solid var(--paper)}
.plan.hl{background:var(--paper);color:var(--ink);border:none}
.plan.hl .k{color:var(--green)}
.plan.hl p{color:var(--text2)}
.plan.hl .btn{background:var(--orange);color:#fff;border:none}
.plan .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.plan .hot{font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--orange);color:#fff}
.form-s .foot{margin-top:28px;font-size:14px;color:#8E9C92}

/* steps */
.steps{padding:110px 0}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:52px}
.step{border-top:3px solid var(--ink);padding-top:24px;display:flex;flex-direction:column;gap:12px}
.step .n{font-family:'Bricolage Grotesque',sans-serif;font-size:54px;font-weight:800;color:var(--orange)}
.step h3{font-size:21px;font-weight:700}
.step p{font-size:16px;line-height:1.6;color:var(--text2)}

/* zone */
.zone{padding:0 0 110px}

.zone h2{font-size:50px}
.zone p{font-size:18px;line-height:1.6;color:var(--text2);margin-top:18px}
.towns{display:flex;flex-wrap:wrap;gap:10px}
.towns span{padding:10px 18px;background:#fff;border-radius:999px;font-weight:600;font-size:15px}
.towns span.all{background:var(--ink);color:var(--paper)}

/* faq */
.faq{padding:0 0 110px}
.faq .wrap{display:grid;grid-template-columns:400px 1fr;gap:64px}
